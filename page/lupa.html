<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password | AjemTrip</title>
    <link rel="stylesheet" href="../css/lupalogin.css">
</head>
<body>
    <main class="container">
        <h3>Reset Password</h3>
        <p>Masukkan email dan password baru Anda.</p>
        <form id="forgot-password-form">
            <label for="email">Email</label><input type="email" id="email" required>
            <label for="newPassword">Password Baru</label><div class="password-input"><input type="password" id="newPassword" minlength="6" required><button type="button" data-password-toggle="newPassword" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div>
            <label for="confirmPassword">Konfirmasi Password</label><div class="password-input"><input type="password" id="confirmPassword" minlength="6" required><button type="button" data-password-toggle="confirmPassword" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div>
            <button type="submit">Simpan Password Baru</button>
        </form>
        <p><a href="../index.html">Kembali ke login</a></p>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/password-toggle.js"></script>
    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', (event) => {
            event.preventDefault();
            if (document.getElementById('newPassword').value !== document.getElementById('confirmPassword').value) {
                alert('Konfirmasi password tidak sama.');
                return;
            }
            try {
                const email = document.getElementById('email').value.trim().toLowerCase();
                AjemAuth.updatePassword(email, document.getElementById('newPassword').value);
                const subject = encodeURIComponent('Konfirmasi perubahan password AjemTrip');
                const body = encodeURIComponent('Password akun AjemTrip Anda baru saja berhasil diubah.');
                window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
                setTimeout(() => {
                    alert('Password berhasil diubah. Aplikasi email dibuka untuk mengirim konfirmasi ke email Anda.');
                    window.location.href = '../index.html';
                }, 500);
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>
</html>
