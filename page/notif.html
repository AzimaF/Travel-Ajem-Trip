<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi | AjemTrip</title>
    <link rel="stylesheet" href="../css/styleFilter.css">
</head>
<body>
    <nav class="navbar"><a href="../indeks.html" class="navbar-logo">Ajem<span>Trip</span></a><div class="navbar-extra"><a href="../akun.html">Profil</a></div></nav>
    <main class="container">
        <h1>Notifikasi</h1>
        <div id="notificationList"></div>
        <button id="markRead" type="button">Tandai semua sudah dibaca</button>
    </main>
    <script src="../js/auth.js"></script>
    <script>
        const list = document.getElementById('notificationList');
        function render() {
            const items = AjemAuth.notifications();
            list.innerHTML = items.length ? items.map((item) => `<article class="${item.read ? '' : 'unread'}"><strong>${item.message}</strong><p>${item.date}</p></article>`).join('') : '<p>Belum ada notifikasi.</p>';
        }
        document.getElementById('markRead').onclick = () => { AjemAuth.markNotificationsRead(); render(); };
        render();
    </script>
</body>
</html>
