<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | AjemTrip</title>
    <link rel="stylesheet" href="../css/regis.css">
    <link rel="shortcut icon" href="../img/Logo Ajem trip.png" type="image/x-icon">
</head>
<body>
    <main>
        <section class="register-card">
            <a class="home-link" href="../index.html">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path><path d="M9 12h12"></path></svg>
                Kembali ke Home
            </a>
            <h1>Daftar Akun</h1>
            <h5>Lengkapi data untuk membuat akun AjemTrip.</h5>
            <div class="login-form">
                <form id="register-form">
                    <div class="input-group"><label for="username">Username</label><input type="text" id="username" required></div>
                    <div class="input-group"><label for="fullName">Nama Lengkap</label><input type="text" id="fullName" required></div>
                    <div class="input-group"><label for="phone">Nomor Telepon</label><input type="tel" id="phone" required></div>
                    <div class="input-group"><label for="email">Email</label><input type="email" id="email" required></div>
                    <div class="input-group"><label for="password">Password</label><div class="password-input"><input type="password" id="password" minlength="6" required><button type="button" data-password-toggle="password" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div></div>
                    <div class="input-group"><label for="confirmPassword">Konfirmasi Password</label><div class="password-input"><input type="password" id="confirmPassword" minlength="6" required><button type="button" data-password-toggle="confirmPassword" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div></div>
                    <button type="submit" class="submit-button">Register</button>
                    <button type="button" class="daftar-button" onclick="window.location.href='../index.html'">Sudah Punya Akun?</button>
                </form>
            </div>
        </section>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/password-toggle.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('confirmPassword').value) {
                alert('Konfirmasi password tidak sama.');
                return;
            }
            try {
                AjemAuth.register({
                    username: document.getElementById('username').value.trim(),
                    fullName: document.getElementById('fullName').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    email: document.getElementById('email').value.trim().toLowerCase(),
                    password
                });
                alert('Registrasi berhasil. Selamat datang!');
                window.location.href = '../akun.html';
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>
</html>
